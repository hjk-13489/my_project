<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}校园二手书交易平台{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">校园二手书</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'product_list' %}">商品浏览</a>
                {% if user.is_authenticated %}
                    <a class="nav-link" href="{% url 'profile' %}">个人中心</a>
                    <a class="nav-link" href="{% url 'publish' %}">发布商品</a>
                    <span class="navbar-text me-2">{{ user.username }}</span>
                    {% if user.is_verified %}
                        <span class="navbar-text me-3"><span class="badge bg-success">✓ 已认证</span></span>
                    {% else %}
                        <span class="navbar-text me-1"><span class="badge bg-warning text-dark">待认证</span></span>
                        <a class="nav-link d-inline-block me-2" href="{% url 'verify' %}">去认证</a>
                    {% endif %}
                    <form action="{% url 'logout' %}" method="post" class="d-inline">{% csrf_token %}<button type="submit" class="nav-link btn btn-link border-0">退出</button></form>
                {% else %}
                    <a class="nav-link" href="{% url 'register' %}">注册</a>
                    <a class="nav-link" href="{% url 'login' %}">登录</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
